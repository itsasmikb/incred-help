<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InCred LeadSquared Help</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#14213d; --muted:#5b6475; --line:#e1e5ec;
  --accent:#e8590c; --accent-ink:#ffffff; --accent-soft:#fff0e6; --accent-text:#b8460a;
  --you:#14213d; --you-ink:#ffffff; --mark:#ffe2cc;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1627; --surface:#172036; --ink:#e8ecf4; --muted:#9ba6bc; --line:#26324d;
  --accent:#ff8a3d; --accent-ink:#1a0d03; --accent-soft:#3a2416; --accent-text:#ffb07a;
  --you:#2b3a5c; --you-ink:#ffffff; --mark:#5a3216; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1627; --surface:#172036; --ink:#e8ecf4; --muted:#9ba6bc; --line:#26324d;
  --accent:#ff8a3d; --accent-ink:#1a0d03; --accent-soft:#3a2416; --accent-text:#ffb07a;
  --you:#2b3a5c; --you-ink:#ffffff; --mark:#5a3216; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}

.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
/* header */
.bar{flex:none;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{flex:none;width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.brand b{display:block;font-weight:700;line-height:1.15;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap}
.role{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.role button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:.87rem;font-weight:600;color:var(--muted);white-space:nowrap}
.role button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.87rem;font-weight:600}
.icon-btn svg{width:17px;height:17px}

/* chat */
#chat{flex:1;overflow-y:auto;scroll-behavior:smooth}
.chat-in{max-width:820px;margin:0 auto;padding:20px 16px 12px}
.msg{display:flex;gap:10px;margin:0 0 16px;align-items:flex-start}
.msg.you{justify-content:flex-end}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:.75rem;margin-top:2px}
.bubble{max-width:min(640px,88%);border-radius:18px;padding:12px 16px}
.you .bubble{background:var(--you);color:var(--you-ink);border-bottom-right-radius:6px}
.bot .bubble{background:var(--surface);border:1px solid var(--line);border-top-left-radius:6px}
.bubble p{margin:0 0 10px}.bubble p:last-child{margin-bottom:0}
.bubble h3{font-size:1.05rem;margin:0 0 6px;font-weight:700}
.lead{font-size:1.04rem}
.steps{list-style:none;margin:6px 0 12px;padding:0}
.steps li{position:relative;padding:2px 0 12px 40px}
.steps li::before{content:attr(data-n);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem;display:grid;place-items:center}
.steps li:not(:last-child)::after{content:"";position:absolute;left:13px;top:31px;bottom:2px;width:2px;background:var(--line)}
.bullets{margin:4px 0 12px;padding-left:1.15em}.bullets li{margin:0 0 6px}
figure{margin:6px 0 14px}
figure img{display:block;max-width:100%;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;background:var(--bg)}
figcaption{font-size:.82rem;color:var(--muted);margin-top:5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.link-btn{border:0;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:.88rem;border-radius:999px;padding:6px 12px}
.fb{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.85rem}
.fb button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.85rem}
.fb button[disabled]{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.9rem;text-align:left;line-height:1.3}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.chips-label{width:100%;font-size:.85rem;font-weight:700;color:var(--muted);margin-top:6px}
.hits{margin:8px 0 0;padding:0;list-style:none}
.hits li{border-top:1px solid var(--line);padding:10px 0}
.hits li:first-child{border-top:0;padding-top:4px}
.hits b{display:block}
.hits span{display:block;color:var(--muted);font-size:.9rem;margin:2px 0 4px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:1}}

/* composer */
.composer{flex:none;background:var(--bg);padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.composer-in{max-width:820px;margin:0 auto;position:relative}
.suggest{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(20,33,61,.12);overflow:hidden;display:none}
.suggest.on{display:block}
.suggest button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 14px;font-size:.95rem}
.suggest button:first-child{border-top:0}
.suggest button[aria-selected="true"],.suggest button:hover{background:var(--accent-soft)}
.suggest small{display:block;color:var(--muted);font-size:.8rem}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:6px 6px 6px 14px}
.box:focus-within{border-color:var(--accent)}
.box textarea{flex:1;border:0;background:none;resize:none;font:inherit;color:var(--ink);padding:8px 0;max-height:140px;outline:none}
.send{flex:none;width:42px;height:42px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.send[disabled]{opacity:.45;cursor:default}
.send svg{width:20px;height:20px}
.hint{max-width:820px;margin:6px auto 0;color:var(--muted);font-size:.78rem;text-align:center}

/* manual panel */
.sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(10,16,30,.45)}
.sheet.on{display:block}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.panel-top{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.panel-top h2{margin:0;font-size:1.1rem;margin-right:auto}
.panel-body{flex:1;overflow-y:auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.msearch{width:100%;font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);margin-bottom:14px}
.msearch:focus{outline:none;border-color:var(--accent)}
.toc-h{font-size:.9rem;font-weight:700;color:var(--muted);margin:16px 0 8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.row.sub{padding-left:30px;font-size:.95rem}
.row .go{margin-left:auto;color:var(--muted);flex:none}
.sec h1{font-size:1.45rem;line-height:1.2;margin:4px 0 12px}
.sec-body{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 18px 8px}
.sec-body h4{font-size:1rem;margin:16px 0 4px}
.sec-body ul,.sec-body ol{padding-left:1.25em;margin:4px 0 12px}
.sec-body li{margin:0 0 5px}
.sec-body p{margin:10px 0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.back{border:0;background:none;color:var(--accent-text);font-weight:700;padding:0;margin-bottom:6px}
.shots-h{font-weight:700;margin:20px 0 8px}

.zoom{position:fixed;inset:0;background:rgba(6,10,20,.9);display:none;z-index:40;place-items:center;padding:16px;cursor:zoom-out}
.zoom.on{display:grid}.zoom img{max-width:100%;max-height:100%;border-radius:8px}

@media (max-width:600px){
  body{font-size:16px}
  .brand small,.brand b{display:none}
  .icon-btn span{display:none}
  .icon-btn{padding:7px 9px}
  .role button{padding:6px 10px}
  .bubble{max-width:92%}
  .avatar{display:none}
}
@media (prefers-reduced-motion: reduce){#chat{scroll-behavior:auto}.typing i{animation:none;opacity:.8}}
</style>
</head>
<body>
<div class="app">
  <header class="bar"><div class="bar-in">
    <div class="brand"><span class="logo" aria-hidden="true">IC</span><span><b>LeadSquared Help</b><small>InCred user manual assistant</small></span></div>
    <div class="role" role="group" aria-label="Help for">
      <button data-role="rm" aria-pressed="true">Sales User</button>
      <button data-role="admin" aria-pressed="false">Admin</button>
    </div>
    <button class="icon-btn" id="openManual" aria-label="Open the manual"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6.5a2.5 2.5 0 0 0 0 5H20"/></svg><span>Manual</span></button>
    <button class="icon-btn" id="newChat" aria-label="Start a new chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span></button>
  </div></header>

  <div id="chat" aria-live="polite"><div class="chat-in" id="log"></div></div>

  <div class="composer"><div class="composer-in">
    <div class="suggest" id="suggest" role="listbox" aria-label="Suggested questions"></div>
    <div class="box">
      <textarea id="q" rows="1" placeholder="Ask a question, e.g. how do I set a follow-up?" aria-label="Ask a question" autocomplete="off"></textarea>
      <button class="send" id="send" aria-label="Send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="hint">Answers come from the InCred LeadSquared user manual. Not covered? Ask your Team Lead or Admin.</div>
  </div></div>
</div>

<div class="sheet" id="sheet"><div class="panel" role="dialog" aria-label="Manual">
  <div class="panel-top"><h2>Manual</h2><button class="icon-btn" id="closeManual">Close</button></div>
  <div class="panel-body" id="manual"></div>
</div></div>
<div class="zoom" id="zoom" role="dialog" aria-label="Screenshot"><img alt=""></div>

<script>
const FAQ = [{"id": "start-day", "role": "rm", "title": "Start my day", "qs": ["What should I do first every day?", "daily routine", "what to do first", "morning checklist", "how to plan my day"], "kw": [], "a": "Clear overdue work first, then follow-ups and drop-offs, then new leads.\n1. Log in and open your **Dashboard** (Home icon). Note **Overdue Tasks Count** and **Follow Up Leads**.\n2. Clear overdue tasks (Overdue Tasks Count tile, or each lead's **Tasks** tab).\n3. Work **Today Follow Up Leads** and **Drop Off Leads** in Smart Views.\n4. For each lead: read **Opportunity Details** and **Activity History**, call, then **Mark as Complete** and log the call.\n5. Not resolved? Set a **Follow-up Date & Time**.\n6. Then work **New Leads**, then **Application Submitted** and **Esign Leads**.\n7. At the end of the day, re-check **Completed Tasks Count** and **Conversion Percentage** on the Dashboard.\n[screenshot: dashboard]\n(Manual: Section 9)", "group": "Getting started"}, {"id": "login", "role": "rm", "title": "Login help", "qs": ["How do I log in?", "how to login", "forgot password", "sign in", "otp", "cant login"], "kw": [], "a": "Log in with the email and password your Admin or Team Lead gave you.\n1. Open **app.leadsquared.com**.\n2. On **Welcome to LeadSquared**, enter your email and click **Continue**.\n[screenshot: login_email]\n3. On **Glad to see you!**, check the email (pencil icon to fix it), enter your **Password** and click **Continue**.\n4. Forgot it? Click **Forgot Password?** under the button.\nAfter login you land on **Manage Contacts**. If your account uses OTP login, keep the phone or email that receives the OTP handy.\n(Manual: Section 2)", "group": "Getting started"}, {"id": "dashboard", "role": "rm", "title": "My dashboard", "qs": ["What do the tiles on my Dashboard mean?", "dashboard tiles", "what is conversion percentage", "conversion tat", "my numbers"], "kw": [], "a": "Your **User Dashboard** (Home icon) shows only your numbers. Use **Filter** (top right) to set the period.\n- **Row 1, leads:** Total Leads, Open Leads, Converted Leads (Account Opened), Conversion Percentage, Conversion TAT (average days and hours to convert), Lost Leads.\n- **Row 2, tasks:** Total, Pending (not yet due), **Overdue** (clear these first), Completed, and Follow Up Leads (leads with a follow-up date set).\n- **Calls:** Total and Connected Calls, Unique Leads Connected, Average Call Duration, Outbound and Inbound calls (and how many were answered).\n- **Charts:** Opportunity Trend Analysis, Stage Wise Data Analysis (funnel), Users Phone Call Analysis, Funnel Stage TAT Analysis (time spent in each stage).\n[screenshot: dashboard]\n(Manual: Section 8)", "group": "Getting started"}, {"id": "log-call", "role": "rm", "title": "Log a call", "qs": ["How do I log a call after speaking to a lead?", "add remarks", "where do i write remarks", "how to log a call", "how do i fill the call form", "where do i update call outcome", "mark as complete", "call disposition form"], "kw": [], "a": "Fill the **Call Disposition Form** after every call.\n1. Call the lead by clicking their phone number.\n2. Open the lead's **Tasks** tab (or open the task from a Smart Views tab or your Dashboard).\n3. Open the task and click **Mark as Complete**. The form opens as a side panel.\n[screenshot: mark_complete]\n4. Pick **Cal Status** (Connect or Non Connect), then **Disposition**, then **Sub Disposition**.\n5. Callback needed? Set **Follow-up Date & Time**.\n6. Add **Remarks**, then click **Save** (bottom right). The task is marked complete.\n[screenshot: dispo_followup]\n(Manual: Section 5)", "group": "Calls and follow-ups"}, {"id": "disposition", "role": "rm", "title": "Pick a disposition", "qs": ["Which Call Status, Disposition and Sub Disposition should I choose?", "which disposition to select", "what sub disposition", "call status options", "connect or non connect"], "kw": [], "a": "Choose in this order: **Cal Status** → **Disposition** → the closest **Sub Disposition**.\n- **Connect:** Interested, Poor Network, Not Interested, Language Barrier, Document Issue.\n- **Non Connect:** No Contact.\n- Sub Dispositions ending in **- Retry** keep the lead open so you try again.\n- Sub Dispositions ending in **- Invalid lead** close the lead out. Use them only when you're sure the number or lead isn't valid.\nIf the customer wants a callback (for example **Call Back** or **Customer to do on his own - Follow Up**), also set a **Follow-up Date & Time**.\nOpen the **Manual** and see Section 7 for every option.\n(Manual: Section 7)", "group": "Calls and follow-ups"}, {"id": "follow-up", "role": "rm", "title": "Set a follow-up", "qs": ["How do I set a follow-up?", "how to schedule a callback", "set callback", "follow up date", "remind me to call later", "lead not coming back"], "kw": [], "a": "Set **Follow-up Date & Time** on the Call Disposition Form. It creates a follow-up task due 1 minute after that time, puts the lead back in **Today Follow Up Leads**, and sends you alerts when the task is created and when it's due.\n1. After the call, open the task and click **Mark as Complete**.\n2. Fill **Cal Status**, **Disposition** and **Sub Disposition**. The follow-up field appears only for callback-related Sub Dispositions, such as **Call Back**.\n3. Pick the date (DD/MM/YYYY), then the hour, minute (00 / 15 / 30 / 45) and AM/PM, and click **Ok**.\n4. Click **Save**.\n[screenshot: dispo_followup]\nNo follow-up date means the lead won't come back to you on its own.\n(Manual: Section 5)", "group": "Calls and follow-ups"}, {"id": "alerts", "role": "rm", "title": "Alerts I get", "qs": ["What alerts will I get, and what do they mean?", "notifications", "nudge", "phone alert", "what does new task alert mean", "drop off stage notify"], "kw": [], "a": "LeadSquared sends you in-app alerts on mobile and web. Each one has a button that opens the lead.\n- **New Task:** a follow-up task was created for you. It shows the lead and the due date.\n- **Hello** (reminder): a follow-up task's reminder is due. Open the lead and call.\n- **Drop Off Stage Notify:** one of your leads has stalled at a stage of the KYC flow. Call them to help.\n- **Hello** (new lead): a lead at Application Submitted has been assigned to you.\n[screenshot: nudge_dropoff]\n(Manual: Section 10.12)", "group": "Calls and follow-ups"}, {"id": "tabs", "role": "rm", "title": "Which tab to work", "qs": ["Which Smart Views tab should I work on?", "which tab first", "smart views tabs", "new leads tab", "esign leads", "application submitted tab", "today follow up leads"], "kw": [], "a": "Smart Views shows your leads in six tabs. Work them in this order.\n1. **Drop Off Leads:** reached Lead Verified but didn't complete KYC within 30 minutes. Call these first.\n2. **Today Follow Up Leads:** a follow-up task is due today. Also call first.\n3. **New Leads:** at Lead Verified, waiting for your first call.\n4. **Application Submitted** and **Esign Leads:** nearly done. Help them finish.\n5. **Leads:** every lead assigned to you, for anything else.\n[screenshot: smartviews_tabs]\nUse the filter bar (Status, Stage, Owner and more) or the search box to narrow a list.\n(Manual: Section 3)", "group": "Working your leads"}, {"id": "drop-off", "role": "rm", "title": "Drop-off leads", "qs": ["What is a Drop Off Lead?", "what is drop off", "drop off leads tab", "lead stalled", "lead stuck"], "kw": [], "a": "A Drop Off Lead reached **Lead Verified** but hasn't completed KYC within 30 minutes. The customer started and stalled, so your call is what gets them moving again.\n1. Open **Smart Views** → **Drop Off Leads**. Work this tab first every day, with Today Follow Up Leads.\n2. Open the lead and check **Drop Off Lead Flag** in Opportunity Details. It names the stage where the lead stalled, for example KYC Drop Off.\n3. Call the customer and help them past that stage.\n4. Log the call, and set a follow-up if needed.\n[screenshot: lead_detail]\nYou also get a **Drop Off Stage Notify** alert on mobile and web when one of your leads stalls.\n(Manual: Sections 3, 4 and 6)", "group": "Working your leads"}, {"id": "stages", "role": "rm", "title": "Lead stages", "qs": ["What do the onboarding stages mean?", "lead stages", "onboarding journey", "what does kyc stage mean", "stage meaning", "account opening steps"], "kw": [], "a": "Every lead moves forward through these stages, in order:\n1. **Lead Creation:** email, phone and basic details captured.\n2. **Lead Verified:** phone number OTP verified (New Leads tab).\n3. **KYC:** PAN / Aadhaar captured via DigiLocker.\n4. **Customer Demographic & FATCA:** personal details being verified.\n5. **Bank Details & Verification:** bank added; penny-drop or cheque verification.\n6. **Trading Preference & Segment Selection:** Cash / F&O / Commodity chosen.\n7. **Account Preferences:** brokerage plan selected.\n8. **e-Sign (Selfie, Sign, KRA, AOF)** (Esign Leads tab).\n9. **Application Submitted** (Application Submitted tab).\n10. **Account Opened / First Trade:** Won.\nLost stages: **Closed - Lost** (closed automatically after no progress) and **Decided not to buy**.\n(Manual: Section 6)", "group": "Working your leads"}, {"id": "create-user", "role": "admin", "title": "Create a user", "qs": ["How do I create a new Sales User?", "add new user", "create rm", "add sales user", "new employee"], "kw": [], "a": "Go to **Settings → Users and Permissions → Users**.\n1. Click **Create** (blue, top right of the list).\n2. In **Basic Details**, fill First Name, Last Name, Email Address, Phone (Mobile), User Type, Sales Role, Reporting to, Team and **Employee Code** (required).\n3. Check **Sales Role**: it starts as Administrator. RMs need **Sales User**.\n4. Click **Create User**, or **Create and Add New** to add another.\n[screenshot: create_user]\n(Manual: Section 10.2)", "group": "People and access"}, {"id": "edit-user", "role": "admin", "title": "Edit a user", "qs": ["How do I edit a user?", "change user details", "update user", "edit user"], "kw": [], "a": "Go to **Settings → Users and Permissions → Users**.\n1. Open the user from the Users list. The **Edit user** window shows their name, email, phone and role.\n2. Pick a tab: Details, Work Details, Location Details, Manage Permissions, Other Details or Report Subscriptions.\n3. Click **Edit** (top right of the tab) to make changes. **×** closes the window.\n[screenshot: edit_user]\n(Manual: Section 10.2)", "group": "People and access"}, {"id": "permissions", "role": "admin", "title": "Permissions", "qs": ["What can Sales Users do, and how do I change it?", "what can rm do", "permission template", "restrict access", "sales user permissions"], "kw": [], "a": "Go to **Settings → Users and Permissions → Permission Templates → Sales User Permissions**.\n- **Leads:** view, create, import.\n- **Activities:** view, import; create and edit **only Call Disposition**.\n- **Tasks:** view; create and mark complete **only Meeting** tasks.\n- **Opportunity:** view, create.\n- Restricted areas: Marketing, Workflow, Custom Apps.\nTo change a partly allowed (yellow) permission:\n1. Click **Configure** under the yellow circle.\n2. Click **Restrict** to block an item, or **×** on a blocked item to allow it again.\n3. Click **Save**.\n[screenshot: perm_grid]\n(Manual: Section 10.4)", "group": "People and access"}, {"id": "dropdowns", "role": "admin", "title": "Dropdown options", "qs": ["How do I change a dropdown field's options?", "change dropdown values", "add option to dropdown", "edit picklist"], "kw": [], "a": "Go to **Settings → Opportunities → Opportunity Types**, open the Opportunity type's field list, and use the field's **gear**.\n1. Click the gear → **Enter Dropdown Options**.\n2. Choose **Is Dependent Field?** Yes or No.\n3. Type the options, one per line. The top option is the default. Or use **Click here to import a CSV file of options**.\n4. Tick **Allow Auto Update** or **Is Multi-Select Dropdown?** if needed.\n5. Click **Save**.\n[screenshot: dropdown_options]\n(Manual: Sections 10.6 and 10.7)", "group": "Fields, stages and views"}, {"id": "statuses", "role": "admin", "title": "Stages and statuses", "qs": ["How do I change the stages under each status?", "status configuration", "add stage", "change stages"], "kw": [], "a": "Use the **Status Configuration** window for the Opportunity type.\n- **Open** has 9 stages, **Won** 1, **Lost** 2.\n1. Click a status on the left to see its stages on the right.\n2. Click **Add** to add a stage to that status.\n3. Optional: tick **Enable comments on Status change**.\n4. Check **Default Status** (Open) and **Default Stage** (Lead Creation).\n5. Click **Save**.\n[screenshot: status_config]\n(Manual: Section 10.8)", "group": "Fields, stages and views"}, {"id": "smart-views", "role": "admin", "title": "Smart View tabs", "qs": ["How do I edit the Smart View tabs?", "edit smart view", "change tab columns", "smart view settings"], "kw": [], "a": "Go to **Settings → Opportunities → Smart Views**. **INCRED SMART VIEW** is assigned to Mumbai Team and Delhi Team.\n1. Open **INCRED SMART VIEW** for editing (its options are under the **gear** in Actions).\n2. Click a tab (or its **Details** link) to edit it: Leads, New Leads, Today Follow Up Leads, Drop Off Leads, Esign Leads, Application Submitted Leads.\n3. Each tab has its filters, **Manage Filters**, and **Configure** in the Actions column.\n4. Click **Save**.\n[screenshot: sv_edit]\n(Manual: Section 10.10)", "group": "Fields, stages and views"}, {"id": "forms", "role": "admin", "title": "Call Disposition form", "qs": ["How is the Call Disposition form set up?", "call form rules", "short code", "manage forms", "form rules"], "kw": [], "a": "Forms are under **Workflow → Manage Forms**. The **Call Disposition Mumbai Form (F5)** has three sections: Lead Details, Call Details and a Hidden section filled in automatically.\n- When it opens: **Cal Status** is required, **Opportunity Name** is read-only, and Follow-up Date & Time and Remarks are hidden.\n- Picking **Cal Status** makes **Disposition** required; picking **Disposition** makes **Sub Disposition** required.\n- Picking a **Sub Disposition** shows **Remarks**. **Follow-up Date & Time** shows only for 9 selected Sub Dispositions.\n- Each Disposition sets a hidden short code: Interested CS_FLP, Poor Network PNET, Not Interested NI, Language Barrier LB, Document Issue DI, No Contact NC/NCC.\nChanges take effect after 5 minutes.\n(Manual: Section 10.13)", "group": "Fields, stages and views"}, {"id": "routing", "role": "admin", "title": "Lead routing", "qs": ["How are leads assigned to teams?", "lead assignment", "who gets the lead", "mumbai or delhi team", "distribute opportunity", "lead allocation"], "kw": [], "a": "Two automations decide who owns a lead.\n- **Opp create:** every new opportunity is first assigned to a set default user.\n- **Stage Flow:** when a lead reaches **Lead Verified** it's distributed to **Mumbai Team** users; at **Application Submitted** it's distributed to **Delhi Team** users. The owner then gets a nudge.\n- Working hours are 09:00–17:00. Leads arriving outside these hours wait until **10:00 AM** before they're assigned.\n- The team for each branch is set by the Admin in each **Distribute Opportunity** step's user properties.\n[screenshot: auto_stage_flow]\n(Manual: Section 10.12)", "group": "Automations"}, {"id": "automations", "role": "admin", "title": "Automations overview", "qs": ["What automations are running?", "what automations", "workflows running", "background automations"], "kw": [], "a": "Six automations run in the background.\n- **Opp create:** assigns every new opportunity to a set default user and updates the contact's name and owner.\n- **Stage Flow:** stamps stage times, flags drop-offs after a 2-minute check, assigns Lead Verified leads to Mumbai Team and Application Submitted leads to Delhi Team, and alerts owners.\n- **Task Created Nudge:** alerts the owner when a Meeting (follow-up) task is created.\n- **Follow Up Task Nudge:** alerts the owner when a Meeting task's reminder fires.\n- **Call Disposition Flow:** copies the call outcome to the opportunity and creates the follow-up task when a follow-up date is set.\n- **Outbound Activity Flow:** counts call attempts and connected calls, and keeps call dates up to date.\n[screenshot: auto_stage_flow]\n(Manual: Section 10.12)", "group": "Automations"}, {"id": "duplicates", "role": "admin", "title": "Duplicate leads", "qs": ["How does duplicate detection work?", "duplicate detection", "duplicate opportunity", "same customer twice"], "kw": [], "a": "Go to **Settings → Opportunities → Duplicate Detection**. It's enabled for Opportunity.\nRule 1 treats a new opportunity as a duplicate when **all** of these match:\n1. Phone contains data.\n2. The contact already has an Opportunity with Status **Open**.\n3. The contact has an Opportunity with the **same Product**.\nIf a rule matches, no new opportunity is created. A **Duplicate Detected** activity is added to the existing one (the oldest, if there are several). Rule changes take effect after 15 minutes.\n[screenshot: dup_detect]\n(Manual: Section 10.9)", "group": "Automations"}, {"id": "overdue", "role": "rm", "title": "Clear an overdue task", "qs": ["what is an overdue task", "how do i clear overdue tasks", "overdue tasks count", "task is overdue"], "kw": ["overdue"], "a": "A task is **Overdue** when its due date has passed and it's still open. It keeps counting on your Dashboard until you complete or reschedule it.\n1. Open your Dashboard (Home icon) and check **Overdue Tasks Count**.\n2. Open the lead's **Tasks** tab. Overdue tasks show **Overdue by N day(s)**.\n3. Call the lead, then open the task, click **Mark as Complete** and fill the Call Disposition Form.\n[screenshot: tasks_tab]\nThe pencil icon on a task edits it; the bin icon deletes it.\n(Manual: Section 4)", "group": "Working your leads"}, {"id": "lead-page", "role": "rm", "title": "The Lead Detail page", "qs": ["what is on the lead detail page", "open a lead", "lead details", "opportunity details tab", "v-card"], "kw": ["lead detail", "opportunity details"], "a": "Click a lead's name in any Smart Views list to open its Lead Detail page. Every action on a lead starts here.\n- **Left panel (V-card):** lead name with Status – Stage, the Associated Contact, a **Lead Overview** shortcut, Details and Opportunity Properties.\n- **Opportunity Details** (opens first): owner, status and stage, Additional Details (Drop Off Lead Flag, Working Hour lead Flag), Disposition and Call Details, and the Stage Timeline.\n- **Activity History:** every call, with a recording player.\n- **Tasks:** every follow-up task, with Completed or Overdue flags.\n[screenshot: lead_detail]\n(Manual: Section 4)", "group": "Working your leads"}, {"id": "recordings", "role": "rm", "title": "Past calls and recordings", "qs": ["where can i hear call recordings", "call history", "previous calls", "activity history", "download recording"], "kw": ["recording", "activity history"], "a": "Open the lead and go to the **Activity History** tab.\n- Every call is listed, newest first, grouped by month: who placed it, the number used, duration, date and how long ago.\n- Each call has a **recording player** and a **download** icon.\n- Use the **Activity Type** and **Date** filters to narrow the list.\n[screenshot: activity_history]\nCheck it before you call, so you know what was said last time.\n(Manual: Section 4)", "group": "Calls and follow-ups"}, {"id": "not-in-today", "role": "rm", "title": "Lead missing from Today Follow Up", "qs": ["why is my lead not in today follow up leads", "follow up lead missing", "lead did not come back", "today follow up empty"], "kw": ["today follow up", "missing"], "a": "**Today Follow Up Leads** only shows leads with a follow-up task due today. A lead is missing when no follow-up was set.\n- The follow-up task is only created if you set **Follow-up Date & Time** when you logged the call.\n- **Follow-up Date & Time** only appears for certain Sub Dispositions, such as callback ones.\n- The task is due 1 minute after the time you set, so it shows on that day.\nFix it: log a new call on the lead and set the Follow-up Date & Time.\n(Manual: Sections 3 and 5)", "group": "Calls and follow-ups"}, {"id": "retry-invalid", "role": "rm", "title": "Retry vs Invalid lead", "qs": ["what does retry mean", "what does invalid lead mean", "difference between retry and invalid", "close a lead"], "kw": ["retry", "invalid"], "a": "The end of a Sub Disposition tells you what happens to the lead.\n- **Ending in \"- Retry\"** (for example **No Answer/Ringing - Retry**): the lead stays open so you try again.\n- **Ending in \"- Invalid lead\"** (for example **Invalid/Wrong Number - Invalid lead**): closes the lead out. Use it only when you're sure the number or lead isn't valid.\n(Manual: Section 7)", "group": "Calls and follow-ups"}, {"id": "no-answer", "role": "rm", "title": "Customer didn't pick up", "qs": ["customer not answering", "call not connected", "switched off", "no answer what to select", "phone ringing no answer", "not reachable"], "kw": ["not answer", "non connect", "no contact"], "a": "Choose **Cal Status: Non Connect** → **Disposition: No Contact**, then the closest Sub Disposition:\n- **Switched off - Retry**\n- **No Answer/Ringing - Retry**\n- **Answering Machine/Voicemail - Retry**\n- **Call disconnected - Retry**\n- **Not Reachable - Retry**\n- **Invalid/Wrong Number - Invalid lead** or **Number not in use - Invalid lead** (these close the lead)\nIf the **Follow-up Date & Time** field appears, set when to try again.\n(Manual: Section 7)", "group": "Calls and follow-ups"}, {"id": "callback", "role": "rm", "title": "Customer asked to call back", "qs": ["customer asked me to call later", "call back later", "customer busy", "callback request"], "kw": ["call back", "callback", "busy"], "a": "Choose **Cal Status: Connect** → **Disposition: Interested**, then the matching Sub Disposition:\n- **Call Back:** they gave you a time.\n- **Call Back No Time Given:** they didn't.\n- **Guided Call Back**\n- **Customer to do on his own - Follow Up**\nThen set **Follow-up Date & Time** to the agreed time and click **Save**. That creates your follow-up task.\n[screenshot: dispo_followup]\n(Manual: Sections 5 and 7)", "group": "Calls and follow-ups"}, {"id": "not-interested", "role": "rm", "title": "Customer not interested", "qs": ["customer said not interested", "customer refused", "high brokerage", "switched to competitor", "enquiry only"], "kw": ["not interested"], "a": "Choose **Cal Status: Connect** → **Disposition: Not Interested**, then the reason:\n- **Hang up - Trust issues**\n- **No Research Calls**\n- **High Brokerage**\n- **Switched to competitor**\n- **Enquiry only**\n- **Invalid lead - Minor/PEP**, **Invalid lead - non-broking product**, **Invalid lead - customer not opted**\n(Manual: Section 7)", "group": "Calls and follow-ups"}, {"id": "doc-issue", "role": "rm", "title": "Customer has a document problem", "qs": ["aadhaar not linked", "pan not linked", "name mismatch", "document issue", "signature mismatch", "photo upload issue"], "kw": ["document", "aadhaar", "pan"], "a": "Choose **Cal Status: Connect** → **Disposition: Document Issue**, then the problem:\n- **Aadhaar not linked with Mobile**\n- **PAN not linked with Mobile**\n- **PAN not linked with Aadhaar**\n- **Name Mismatch (Bank vs Aadhaar)**\n- **Cheque/Statement not handy**\n- **Signature Mismatch**\n- **Photo upload Issue**\n- **Income Proof Doc Issue**\n(Manual: Section 7)", "group": "Calls and follow-ups"}, {"id": "language", "role": "rm", "title": "Customer speaks another language", "qs": ["language barrier", "customer speaks tamil", "customer doesn't speak hindi", "regional language"], "kw": ["language"], "a": "Choose **Cal Status: Connect** → **Disposition: Language Barrier**, then the language: **Kannada, Tamil, Telugu, Malayalam, Gujarati, Bengali, Oriya, Punjabi** or **Others**.\n(Manual: Section 7)", "group": "Calls and follow-ups"}, {"id": "poor-network", "role": "rm", "title": "Call dropped or bad network", "qs": ["poor network", "call dropped", "bad connection", "voice breaking"], "kw": ["network"], "a": "Choose **Cal Status: Connect** → **Disposition: Poor Network** → **Connectivity issues - Retry**. The lead stays open so you can try again.\n(Manual: Section 7)", "group": "Calls and follow-ups"}, {"id": "interested-done", "role": "rm", "title": "Customer finished KYC or opened account", "qs": ["kyc submitted", "account already opened", "account opened alternate number", "kyc rejected"], "kw": ["kyc submitted", "already opened"], "a": "Choose **Cal Status: Connect** → **Disposition: Interested**, then:\n- **KYC Submitted**\n- **Account Opened - Alternate Number**\n- **A/C Already Opened**\n- **KYC Rejected/On Hold**\n- **Tech Issues**, if something in the app stopped them\n(Manual: Section 7)", "group": "Calls and follow-ups"}, {"id": "drop-flags", "role": "rm", "title": "What the drop-off flag means", "qs": ["what does kyc drop off mean", "fatca drop off", "drop off lead flag values", "moved to next stage", "esign drop off"], "kw": ["drop off flag", "moved to next stage"], "a": "The **Drop Off Lead Flag** (in Opportunity Details) shows where a lead stalled. A check runs 2 minutes after the lead enters each stage.\n- **Lead Verified Drop Off**, **KYC Drop Off**, **FATCA Drop Off**, **Bank Details Drop Off**, **Trading Drop Off**, **Account Drop Off**, **eSign Drop Off:** the lead didn't reach the next stage in time.\n- **Moved to Next Stage:** the lead moved on.\nWhen a lead stalls, its owner gets a **Drop Off Stage Notify** alert.\n(Manual: Sections 4 and 10.12)", "group": "Working your leads"}, {"id": "working-hours", "role": "rm", "title": "Leads that arrive at night", "qs": ["working hours", "lead came at night", "why lead assigned at 10 am", "after hours leads"], "kw": ["working hours", "10 am", "night"], "a": "Working hours are **09:00 to 17:00**.\n- Leads that reach Lead Verified or Application Submitted during working hours are assigned as soon as the automation reaches that step.\n- Leads that arrive outside those hours wait until **10:00 AM** before they're assigned.\n- The **Working Hour lead Flag** on the lead shows Yes or No.\n(Manual: Section 10.12)", "group": "Working your leads"}, {"id": "find-lead", "role": "rm", "title": "Find a specific lead", "qs": ["how do i search a lead", "find customer", "search by name", "search by phone"], "kw": ["search", "find"], "a": "Use a search box:\n- **Smart Views:** the search box above any tab's list finds a lead by name. The filter bar narrows by Status, Stage, Owner and more.\n- **Manage Contacts** (Contacts tab, your home page): **Search here**, **My Filters** or **+ Filter**.\n[screenshot: home_contacts]\n(Manual: Sections 2 and 3)", "group": "Working your leads"}, {"id": "task-types", "role": "rm", "title": "Which tasks I can create", "qs": ["cant create task", "cannot mark complete", "task type", "meeting task", "phone call task blocked"], "kw": ["task", "meeting"], "a": "Sales Users can create and complete **Meeting** tasks only. Follow-Up and Phone Call task types are blocked.\n- Follow-up tasks are created for you as **Meeting** tasks called **Follow Up Meeting:** *lead name* when you set a Follow-up Date & Time.\n- On calls, you can create and edit only the **Call Disposition** activity.\n(Manual: Sections 10.4 and 10.12)", "group": "Calls and follow-ups"}, {"id": "call-counts", "role": "rm", "title": "How my calls are counted", "qs": ["call attempts", "connected calls", "how are calls counted", "connected call counter", "no of call attempts"], "kw": ["call attempts", "connected"], "a": "Every outbound call updates the lead automatically.\n- **No of Call Attempts** goes up by 1, and **Last Outbound Call Date** and **Last Called By** update.\n- The first call sets **First Outbound Call Date**.\n- Answered calls update **First/Last Connected Call Date** and add 1 to **Connected Call Counter**.\nThese fields are in Phone Call Details on the lead.\n(Manual: Section 10.12)", "group": "Calls and follow-ups"}, {"id": "won-lost", "role": "rm", "title": "Won and lost leads", "qs": ["account opened", "won lead", "lost lead", "closed lost", "decided not to buy"], "kw": ["won", "lost"], "a": "- **Won – Account Opened / First Trade:** the account is live. It counts in **Converted Leads** on your Dashboard.\n- **Lost – Closed - Lost:** closed automatically by a time-based rule after no progress.\n- **Lost – Decided not to buy:** the customer isn't interested or was disqualified.\n(Manual: Section 6)", "group": "Working your leads"}, {"id": "home", "role": "rm", "title": "The page after login", "qs": ["manage contacts", "home page", "contacts tab", "first screen"], "kw": ["manage contacts", "home"], "a": "After login you land on **Manage Contacts** (the Contacts tab).\n- **Find a contact:** Search here, My Filters or + Filter.\n- **Columns:** Contact Name, Actions, Contact Score, Phone, Contact Stage, Contact Owner, Modified On, Email.\n- **Row actions:** an email icon, a phone icon to call, and ⋮ for more.\nFor your daily lead work, open **Smart Views** in the top menu.\n[screenshot: home_contacts]\n(Manual: Section 2)", "group": "Getting started"}, {"id": "teams", "role": "admin", "title": "Teams", "qs": ["how do i see teams", "create a team", "mumbai team delhi team", "team structure"], "kw": ["team"], "a": "Go to **Settings → Users and Permissions → Teams**. Mumbai Team and Delhi Team sit under InCred TechInvest Private Limited.\n- **Search Teams** finds a team; the arrow shows or hides sub-teams.\n- **Create** adds a team; **Export** downloads the list.\n- The **gear** under Actions holds each team's options.\n[screenshot: teams]\n(Manual: Section 10.3)", "group": "People and access"}, {"id": "profile", "role": "admin", "title": "My Profile", "qs": ["edit my profile", "my details", "change my name"], "kw": ["profile"], "a": "Go to **Settings → Profile → My Profile** and click **Edit** (right of Personal Details).\n[screenshot: settings_profile]\n(Manual: Section 10.1)", "group": "People and access"}, {"id": "fields", "role": "admin", "title": "Opportunity fields", "qs": ["list of fields", "add a field", "opportunity field list", "custom fields", "schema name"], "kw": ["field", "schema"], "a": "Go to **Settings → Opportunities → Opportunity Types**, open the **Opportunity** type, and view its field list.\n- Each row shows display name, schema name, data type, a **gear** for settings, and a checkbox.\n- **Add Field** adds one; then **Next**.\n- Field types include Dropdown (e.g. Product, Gender, Segment Selection), field sets (Stage Timeline, Phone Call Details, Additional Details, Call Disposition Details, Rejection), text, number and date fields.\n[screenshot: opp_fields]\n(Manual: Section 10.6)", "group": "Fields, stages and views"}, {"id": "field-sets", "role": "admin", "title": "Field sets (CFS)", "qs": ["what is a cfs", "custom field set", "phone call details fields", "additional details fields", "call disposition details fields"], "kw": ["cfs", "field set"], "a": "A CFS (Custom Field Set) groups several fields under one opportunity field. Open it with the field's gear → **Edit Custom Field Set**.\n- **Phone Call Details:** call dates, Last Called By, Connected Call Counter.\n- **Additional Details:** Initial Owner, 30 Min Moved Stage Flag, Drop Off Lead Flag, Working Hour lead Flag, Opp Owner Employee Code, Opp Moved to Aplication Submit.\n- **Call Disposition Details:** Sub Disposition Status, first/last disposition dates, Disposition Count, Follow Up Date, Owner Last Disposition By, Call Status, Call Disposition, Remarks.\n- **Stage Timeline:** start and end times for each stage. **Rejection:** Rejection Reason.\n[screenshot: cfs_edit]\n(Manual: Section 10.6)", "group": "Fields, stages and views"}, {"id": "mask", "role": "admin", "title": "Hide a field's value", "qs": ["mask value", "hide field value", "field configuration", "render type"], "kw": ["mask"], "a": "Click the field's **gear**:\n- **Text field:** Field Configuration → **Show as** and **Mask Value**.\n- **Date field:** Customize *field* Field → **Mask Value**.\n- **Info field:** **Render Type** (Single Select).\nThen click **Save**.\n(Manual: Section 10.7)", "group": "Fields, stages and views"}, {"id": "admin-sv", "role": "admin", "title": "Admin's own Smart Views", "qs": ["admin smart views", "my new contacts", "contact tabs"], "kw": ["admin smart view", "contacts"], "a": "An Administrator's Smart Views screen is contact-based: **My New Contacts**, **My Contacts with Pendi…**, **My Engaged Contacts**, **My Customers**, **My Tasks**. **+** adds a tab. Each tab has Search here, + Filter and a Last Activity dropdown.\n(Manual: Section 10.11)", "group": "Fields, stages and views"}, {"id": "stage-flow", "role": "admin", "title": "How drop-offs are flagged", "qs": ["stage flow automation", "how drop off flag is set", "2 minute check", "stage timeline update"], "kw": ["stage flow", "drop off"], "a": "The **Stage Flow** automation runs every time an opportunity changes.\n1. It stamps the stage's start time (and the previous stage's end time) in Stage Timeline.\n2. It waits **2 minutes**, then checks whether the lead reached the next stage.\n3. Yes → Drop Off Lead Flag = **Moved to Next Stage**. No → the stage's drop-off value (e.g. **KYC Drop Off**) and a **Drop Off Stage Notify** alert to the owner.\n4. At **Lead Verified** and **Application Submitted** it also assigns the lead (Mumbai Team and Delhi Team), with a working-hours check.\n[screenshot: auto_stage_flow]\n(Manual: Section 10.12)", "group": "Automations"}, {"id": "call-flow", "role": "admin", "title": "What happens when a call is logged", "qs": ["call disposition flow", "follow up task creation", "when is follow up task created", "disposition count"], "kw": ["call disposition flow", "create task"], "a": "The **Call Disposition Flow** runs every time a Call Disposition is saved.\n1. It copies Sub Disposition, Call Status and Follow Up Date onto the opportunity and adds 1 to **Disposition Count**.\n2. It sets the first/last disposition dates and **Owner Last Disposition By**.\n3. If a **Follow-up Date & Time** was entered, it creates a **Meeting** task, **Follow Up Meeting:** *lead name*, for the opportunity owner, due **1 minute after** that time.\n[screenshot: followup_task]\nThat task triggers the **New Task** alert, and later a reminder alert.\n(Manual: Section 10.12)", "group": "Automations"}, {"id": "outbound-flow", "role": "admin", "title": "How call counters update", "qs": ["outbound activity flow", "call attempts automation", "connected call counter automation"], "kw": ["outbound"], "a": "The **Outbound Activity Flow** runs for every outbound call.\n- Call Status is copied and **No of Call Attempts** goes up by 1.\n- First call: sets First Outbound Call Date (and First Connected Call Date if answered).\n- Later calls: update Last Outbound Call Date and Last Called By. Answered calls update connected dates and add 1 to **Connected Call Counter**.\n(Manual: Section 10.12)", "group": "Automations"}, {"id": "task-nudges", "role": "admin", "title": "Task alerts", "qs": ["task created nudge", "follow up task nudge", "reminder alert", "new task template"], "kw": ["nudge", "reminder"], "a": "Two automations alert the opportunity owner about **Meeting** tasks (in-app, Mobile and Web):\n- **Task Created Nudge:** when the task is created. Template **New Task**, showing the lead and Due Date.\n- **Follow Up Task Nudge:** when the task's reminder fires. Template **New Lead** (title \"Hello\").\n[screenshot: nudge_newtask]\n(Manual: Section 10.12)", "group": "Automations"}, {"id": "opp-create", "role": "admin", "title": "New opportunity automation", "qs": ["opp create automation", "what happens when a lead is created", "first owner"], "kw": ["opp create"], "a": "The **Opp create** automation runs when an opportunity is added (including imports).\n1. **Distribute Opportunity** assigns it to a set default user.\n2. **Update Contact** sets the contact's First Name from Name on Aadhaar and its Owner from the opportunity's owner.\n[screenshot: auto_opp_create]\n(Manual: Section 10.12)", "group": "Automations"}, {"id": "forms-list", "role": "admin", "title": "Forms", "qs": ["manage forms", "list of forms", "which forms exist", "create form"], "kw": ["form"], "a": "Go to **Workflow → Manage Forms**. Changes take effect after 5 minutes.\n- **F5 Call Disposition Mumbai Form** and **F1 Call Disposition:** the call outcome form.\n- **F4 Lead Overview:** view-only call history; it can't be submitted.\n- **F2 Edit Call Disposition Form:** the call form with every call field read-only.\n- **F3 Form 1:** draft.\n[screenshot: forms_list]\n(Manual: Section 10.13)", "group": "Fields, stages and views"}, {"id": "short-codes", "role": "admin", "title": "Disposition short codes", "qs": ["short code", "disposition short code", "cs_flp", "pnet", "nc ncc"], "kw": ["short code"], "a": "Form rules fill the hidden **Disposition Short Code** field from the Disposition picked:\n- Interested → **CS_FLP**\n- Poor Network → **PNET**\n- Not Interested → **NI**\n- Language Barrier → **LB**\n- Document Issue → **DI**\n- No Contact → **NC** and **NCC** (two rules with the same condition, so only one value is saved)\n(Manual: Section 10.13)", "group": "Fields, stages and views"}, {"id": "form-rules", "role": "admin", "title": "Call form field rules", "qs": ["why is follow up field hidden", "form on load", "mandatory fields on call form", "remarks hidden"], "kw": ["form rule", "mandatory"], "a": "The call form's rules decide what staff see:\n1. On open: **Cal Status** required, **Opportunity Name** read-only, Follow-up Date & Time and Remarks hidden.\n2. Cal Status picked → **Disposition** required.\n3. Disposition picked → **Sub Disposition** required.\n4. Sub Disposition picked → **Remarks** shows.\n5. **Follow-up Date & Time** shows only for 9 selected Sub Dispositions.\n[screenshot: form_followup_rule]\n(Manual: Section 10.13)", "group": "Fields, stages and views"}];
const KB = "# InCred — LeadSquared Sales User Manual (knowledge base)\n\n## Quick start\nEvery lead follows one loop: find it in Smart Views, open it, call, log the call, set the next follow-up.\n1. Log in at app-in21.leadsquared.com (email → Continue → password → Continue).\n2. Click the Home icon → check Overdue Tasks Count and Follow Up Leads on your Dashboard.\n3. In Smart Views, work Drop Off Leads and Today Follow Up Leads first.\n4. Open a lead → read Opportunity Details and Activity History before you call.\n5. Click the lead's phone number to call.\n6. Open the task → Mark as Complete → fill the Call Disposition Form.\n7. Callback needed? Set Follow-up Date & Time, then Save.\n8. Move on to New Leads, then Application Submitted and Esign Leads.\nGolden rule: no follow-up date = the lead will not come back to you on its own.\n\n## 1. About this manual\nFor Sales Users (RMs) and Team Leads working InCred leads in LeadSquared (Org ID 80089). Covers daily work for Sales Users / RMs (Sections 2–9) and setup for Administrators (Section 10). Journey: the Equity account-opening journey. Teams: Mumbai and Delhi. System: LeadSquared, accessed at app.leadsquared.com.\n\n## 2. Logging in\nLogin takes two screens: email first, then password. Use the email ID and password your Admin / Team Lead shared.\n1. Open app.leadsquared.com.\n2. On \"Welcome to LeadSquared\", enter your registered email → Continue.\n3. On \"Glad to see you!\", check the email shown (pencil icon to correct it).\n4. Enter your Password (eye icon shows it) → Continue.\n5. Forgot it? Click \"Forgot Password?\" below the button.\nAfter login the address bar shows app-in21.leadsquared.com and you land on Manage Contacts (the Contacts tab).\nTip: Bookmark app.leadsquared.com. If your account uses OTP two-factor login, keep the phone or email that receives the OTP handy.\n\n### Your home page: Manage Contacts\n- Top menu: Home, Contact Management, Smart Views, Contacts, Opportunities, Activities, Tasks, Lists, Analytics. Search and notifications at top right.\n- Find a contact: Search here, My Filters, or + Filter. The refresh icon shows when the list was last refreshed.\n- Columns: Contact Name, Actions, Contact Score, Phone, Contact Stage (e.g. Prospect), Contact Owner, Modified On, Email. Arrows on a column header sort it; the icon at far right chooses columns.\n- Row actions: email icon, phone icon to call, ⋮ for more.\n- Bottom: total count, Show 25 (rows per page), page numbers.\n\n## 3. Smart Views (your workbench)\nSmart Views shows your leads in six ready-made tabs; each is the same lead list with a different filter.\n- Drop Off Leads (priority 1st): leads that reached Lead Verified but did not complete KYC within 30 minutes. The customer started and stalled.\n- Today Follow Up Leads (1st): leads with a follow-up task due today.\n- New Leads (2nd): leads at Lead Verified; need first outreach.\n- Application Submitted (3rd): leads at Application Submitted; form complete, awaiting next step.\n- Esign Leads (3rd): leads at the e-Sign stage.\n- Leads (default, as needed): every lead assigned to you, no filter.\nOn screen the tabs run: Leads, New Leads, Drop Off Leads, Application Submitted Leads, Today Follow Up Leads, Esign Leads. The open tab shows its lead count in a badge.\nFilters and columns: filter bar (Contact Status, Status, Stage, Owner, Expected Close Date, Actual Close Date); + Filter adds any other field condition; search box jumps to a lead by name; refresh icon next to the tab title reloads; Show 25 (bottom left) sets rows per page; arrows (bottom right) change page. Columns: Opportunity Name, Mobile Number, Status, Stage, Owner, Associated To.\nStatus colours: Open = in progress; Won = account opened; Lost = closed lost / not interested.\n\n## 4. The Lead Detail page\nClick a lead's name in any Smart Views list to open it. Every action on a lead starts here.\nLeft panel (V-card): lead name and Status – Stage (e.g. Open – Lead Verified); Associated Contact and Lead Overview shortcut; Details and Opportunity Properties (Contact Name, Opportunity Name, Status, Product, Owner).\nRight panel tabs (on screen: Activity History, Opportunity Details, Tasks; refresh icon far right):\n- Opportunity Details (opens by default): Associated Contact, Owner, Opportunity Name, Status/Stage, Additional Details, Disposition Details, Call Details, Stage Timeline. Hide Empty Fields toggle hides blanks. Use it to see where the lead is in the funnel and how long it has waited.\n- Activity History: every call, newest first, grouped by month: who placed it, the number used, duration, date, how long ago, with a recording player and download icon. Filters: Activity Type, Date. Check past attempts before you call.\n- Tasks: every follow-up task grouped by due date: title (e.g. Follow Up Meeting: lead name), due date & time, duration, owner, status flag. Filters: Status, Due Date.\nFlags in Opportunity Details: Drop Off Lead Flag = the stage where the lead stalled (e.g. KYC Drop Off, eSign Drop Off); Working Hour lead Flag = whether the lead arrived within team working hours; Stage Timeline = start/end time for each stage.\nTask flags: Completed = already actioned; Overdue by N day(s) = due date passed, task still open. Opening a task shows Mark as Complete (blue), a pencil (edit) icon and a bin (delete) icon.\nImportant: an Overdue task stays open and keeps counting on your Dashboard until you complete or reschedule it. Clear overdue tasks first every day.\n\n## 5. Logging a call: the Call Disposition Form\nFill it after every call.\nOpen the form: 1. Call the lead by clicking the phone number. 2. Go to the lead's Tasks tab (or open the task from a Smart Views tab or Dashboard). 3. Open the task → Mark as Complete. 4. The form opens as a side panel.\nFields:\n- Contact Details: Opportunity Name, Phone Number (read-only; confirm the right person).\n- Cal Status (Call Status) — required: Connect or Non Connect.\n- Disposition — required: outcome of the call (Section 7).\n- Sub Disposition — required: specific reason; options change with the Disposition.\n- Follow-up Date & Time — when a callback is needed: future date (calendar, DD/MM/YYYY) and time (e.g. for Call Back, Customer to do on his own - Follow Up).\n- Remarks — optional.\nNotes: dropdowns say \"Type to search\"; Disposition becomes required once you pick Cal Status, and Sub Disposition once you pick Disposition; Remarks appears once you pick a Sub Disposition; Follow-up Date & Time appears only for certain Sub Dispositions (Section 10.13); time picker uses hour, minute (00/15/30/45), AM/PM, then Ok; the X (top left) closes without saving.\nSave: fill Cal Status → Disposition → Sub Disposition; set Follow-up Date & Time if needed; add Remarks; click Save (bottom right). The task is marked complete.\nMost-missed step: a Follow-up Date & Time automatically creates a follow-up task (\"Follow Up Meeting: lead name\") due 1 minute after that time, and you get alerts when it's created and when its reminder fires (Automations 3–5 in Section 10.12). That puts the lead back in Today Follow Up Leads. Skip it and the lead will not resurface.\n\n## 6. The onboarding journey\nStages only move forward.\n1. Open – Lead Creation: email, phone and basic details captured.\n2. Open – Lead Verified: phone OTP verified (New Leads tab).\n3. Open – KYC: PAN / Aadhaar via DigiLocker.\n4. Open – Customer Demographic & FATCA: personal details verification.\n5. Open – Bank Details & Verification: bank added; penny-drop or cheque verification.\n6. Open – Trading Preference & Segment Selection: Cash / F&O / Commodity.\n7. Open – Account Preferences: brokerage plan selected.\n8. Open – e-Sign (Selfie, Sign, KRA, AOF) (Esign Leads tab).\n9. Open – Application Submitted (Application Submitted tab).\n10. Won – Account Opened / First Trade.\nLost – Closed - Lost: closed automatically by a time-based rule after no progress.\nLost – Decided not to buy: customer not interested / disqualified.\nAll stages appear in the Leads tab.\nDrop Off Leads: a lead becomes a Drop Off Lead when it reaches Lead Verified but has not completed KYC within 30 minutes. Its Drop Off Lead Flag names the stage where it stalled (e.g. KYC Drop Off). A human call gets it moving again.\n\n## 7. Call Status, Disposition & Sub-Disposition reference\nPick in order: Call Status → Disposition → closest Sub-Disposition.\nCall Status: Connect\n- Interested: KYC Submitted; Account Opened - Alternate Number; A/C Already Opened; KYC Rejected/On Hold; Customer to do on his own - Follow Up; Call Back; Call Back No Time Given; Guided Call Back; Tech Issues.\n- Poor Network: Connectivity issues - Retry.\n- Not Interested: Hang up - Trust issues; Invalid lead - Minor/PEP; No Research Calls; High Brokerage; Switched to competitor; Enquiry only; Invalid lead - non-broking product; Invalid lead - customer not opted.\n- Language Barrier: Kannada; Tamil; Telugu; Malayalam; Gujarati; Bengali; Oriya; Punjabi; Others.\n- Document Issue: Aadhaar not linked with Mobile; PAN not linked with Mobile; PAN not linked with Aadhaar; Name Mismatch (Bank vs Aadhaar); Cheque/Statement not handy; Signature Mismatch; Photo upload Issue; Income Proof Doc Issue.\nCall Status: Non Connect\n- No Contact: Switched off - Retry; No Answer/Ringing - Retry; Answering Machine/Voicemail - Retry; Call disconnected - Retry; Not Reachable - Retry; Invalid/Wrong Number - Invalid lead; Number not in use - Invalid lead.\nTip: ending in \"- Retry\" = keep the lead open and try again. Ending in \"- Invalid lead\" = closes the lead out; use only when sure.\n\n## 8. Your Sales Dashboard\nClick the Home icon (top left) to open User Dashboard (also in the Analytics menu). Every number is yours only. Set the period with the Date & Time filter (Filter button, top right): Today, Yesterday, Last 7 Days, This Week, This Month, or custom. Each tile has its own filter icon and an open icon for the full list.\nRow 1 (leads): Total Leads; Open Leads; Converted Leads (reached Account Opened/Won); Conversion Percentage (Converted ÷ Total × 100); Conversion TAT (average creation-to-conversion time, e.g. 26D:15h); Lost Leads.\nRow 2 (tasks): Total Tasks Count; Pending Tasks Count (open, not yet due); Overdue Tasks Count (past due — clear first); Completed Tasks Count; Follow Up Leads (leads with a Follow-up Date & Time set).\nCalls and charts: Total Calls / Connected Calls (Click2Call); Unique Leads Connected; Average Call Duration; Outbound / Inbound Calls; Outbound / Inbound Answered Calls; Opportunity Trend Analysis (monthly Total Opp and Won with Conversion line); Stage Wise Data Analysis (funnel); Users Phone Call Analysis (Total Leads, Total Disposition Attempts, No of Call Attempts, Total Connected Calls, Conversion Percentage); Funnel Stage TAT Analysis (time per stage per lead, D:h, with Summary row).\n\n## 9. Daily routine for an RM\nStart: log in; open the Dashboard, note Overdue Tasks Count and Follow Up Leads.\nFirst: clear overdue tasks (Overdue Tasks Count tile, or the lead's Tasks tab); then work Today Follow Up Leads and Drop Off Leads.\nEach lead: read Opportunity Details and Activity History; call → open the task → Mark as Complete; log Call Status, Disposition, Sub-Disposition, Remarks; not resolved? set Follow-up Date & Time.\nNext: New Leads, then Application Submitted and Esign Leads.\nEnd: re-check Completed Tasks Count and Conversion % on the Dashboard.\n\n## 10. Configuration (Administrators)\nAll screens from an Administrator login. 10.1–10.10 are under Settings; 10.11 is the main Smart Views screen; 10.12 covers Automations.\n\n### 10.1 Settings → Profile → My Profile\nShows the user's own details. To edit: Settings → Profile → My Profile → click Edit (right of Personal Details).\n\n### 10.2 Settings → Users and Permissions → Users\nAdmins create and update LeadSquared users.\nUsers list: Search Users or Advanced Search; Actions menu top right; filters Type (Regular Users), Role, Status, Team; columns Name, Email Address, Role, Permission Templates, Telephony Agent Id, Team, Employee Code. Sub-menu also: Sales Groups, Roles, Teams, Permission Templates, Lead Assignment Quota, Opportunity Assignment Quota, User Availability (User Check-in, Work Day Templates, Holiday Calendar, Leave Tracker).\nCreate a user: 1. Click Create (blue, top right). 2. In Create user → Basic Details fill First Name, Last Name, Email Address, Phone (Mobile), User Type, Sales Role, Reporting to, Team, Employee Code (required). 3. Sales Role is pre-set to Administrator — RMs use Sales User. 4. Click Create User, or Create and Add New.\nView or edit a user: open the user from the Users list (Edit user window shows name, email, phone, role). Tabs: Details, Work Details, Location Details, Manage Permissions, Other Details, Report Subscriptions. Click Edit (top right of the tab); × closes. Details tab fields include Skills, Agent Phone Numbers, Agent WhatsApp Numbers, Phone (Main/Mobile/Others), Time Zone (GMT+05:30 Chennai, Kolkata, Mumbai, New Delhi), Date Format (dd/mm/yyyy).\n\n### 10.3 Settings → Users and Permissions → Teams\nMumbai Team and Delhi Team sit under InCred TechInvest Private Limited. Search Teams; arrow shows/hides sub-teams; Create adds a team; Export downloads the list; gear under Actions holds each team's options.\n\n### 10.4 Settings → Users and Permissions → Permission Templates\nRMs use \"Sales User Permissions\" (\"Permissions set for sales user\").\nTemplate settings: Name (required), Description; User Access: All Users or Sales Group Users (Sales User Permissions uses All Users); Restrict Access toggles — Allowed: Dashboard, Reports, API Access, Call Recordings, Content, Leads, Send Email; Restricted: Marketing, Workflow, Custom Apps.\nAssign Permissions grid: rows Leads, Activities, Tasks, Opportunity; columns View, Create, Edit, Delete, Export, Import, Mark Complete. Green = Allowed, yellow = Partially Allowed (Configure link), empty = Not Allowed, grey = Not Applicable.\nSales User Permissions: Leads — View, Create, Import allowed; Edit, Delete, Export not. Activities — View, Import allowed; Create, Edit partial; Delete, Export not. Tasks — View allowed; Create, Mark Complete partial; Edit, Delete, Export not. Opportunity — View, Create allowed; Edit, Delete, Export, Import not.\nConfigure a partial permission: click Configure under a yellow circle; left list = Available (allowed), right = cannot be created/updated/marked completed; click Restrict to block, × to allow again; Save or Cancel.\nCurrent setup: Activities Create and Edit — only Call Disposition allowed (blocked include Document Generation, Had a Phone Conversation, Left a Voice Mail, Meeting and others). Tasks Create and Mark Complete — only Meeting allowed; Follow-Up and Phone Call blocked.\n\n### 10.5 Settings → Opportunities → Opportunity Types\nDefines opportunity pipelines. InCred has one type: Opportunity (code 12000). Search; Create; gear under Actions. Sub-menu also: Duplicate Detection, Smart Views, Telephony, Rename Opportunity, Opportunity Details View.\n\n### 10.6 Opportunity fields\nEach row: display name (editable), schema name, data type, gear for settings, checkbox. Add Field, then Next (or Back / Cancel).\n- System: Notes, Status, Owner, Created By, Modified On, Modified By.\n- Dropdown: Product (mx_Custom_4), Gender (16), Trading Experience (18), Segment Selection (24), Brokerage Plan (25), Application Submitted (26), First Trade (27), Lead Source (29), OTP Verified (30).\n- Field sets (CFS): Stage Timeline (28), Phone Call Details (31), Additional Details (32), Call Disposition Details (33), Rejection.\n- Text: Description (5), Origin (11), Client Name (12). Number: Expected Deal Size (6), Actual Deal Size (7). Date/DateTime: DOB (15), Created At (17), Expected Closure Date (8), Actual Closure Date (9).\n- Other: Name on Aadhaar (1, Title), Source (3), Info (10, Product), Email Address (13), Mobile Number (14, Phone).\nDropdown options:\n- Product: Individual - Equity, HUF - Equity (product types). Single select.\n- Gender: M, F, Others. Single.\n- Trading Experience: No experience, 1 years, 2-3 years, 4-5 years, 6-10 years, 11-15 years, 15+ years. Single.\n- Segment Selection: Cash, F&O, Commodity - multi selection possible. Multi-select.\n- Brokerage Plan: 9, 999. Single.\n- Application Submitted: Y, N. First Trade: Y, N. OTP Verified: Yes, No. Lead Source: NA (only option).\nField sets:\n- Phone Call Details (fields in view): First Outbound Call Date, Last Outbound Call Date, First Follow Date and Time, First Connected Call Date, Last Connected Call Date (DateTime); Last Called By (User); Connected Call Counter (Number). None mandatory.\n- Additional Details: Initial Owner (User); 30 Min Moved Stage Flag, Drop Off Lead Flag, Working Hour lead Flag (Dropdown); Opp Owner Employee Code (String); Opp Moved to Aplication Submit (Dropdown). None mandatory.\n  - 30 Min Moved Stage Flag: Yes, No. Drop Off Lead Flag options in view: Lead Verified Drop Off, KYC Drop Off, FATCA Drop Off, Bank Details Drop Off, Trading Drop Off, Account Drop Off, eSign Drop Off (blank default). Working Hour lead Flag: Yes, No. Opp Moved to Aplication Submit: Yes, No. These CFS dropdowns have Type 50 characters (fixed), no Multi-Select; leave an empty first line for an empty default.\n- Rejection: one field, Rejection Reason (mx_CustomObject_81, String), not mandatory.\n- Stage Timeline (fields in view, end of list): Account Opened End Time, Closed - Lost Start/End Time, Decided Not to Buy Start/End Time, Lead Verified Start/End Time (DateTime). Filled by the Stage Flow automation.\n- Call Disposition Details: Sub Disposition Status (Dropdown); First Disposition Activity Dte, Last Disposition Activity Date (DateTime); Disposition Count (Number); Follow Up Date (DateTime); Owner Last Disposition By (User); Call Status, Call Disposition (Dropdown); Remarks (String). Follow Up Date is the column in the Today Follow Up Leads tab.\n\n### 10.7 Configuring a field\nEach field's gear opens its settings.\n- Text field: gear → Field Configuration: Show as (e.g. Textbox), Mask Value → Save.\n- String field in a field set (Rejection Reason): Configure String Field — Type String (1000 characters), Mask Value; Current Status shows free slots (String 1000: 9 of 10; Content 5 of 5).\n- Date or Info field: gear → Customize <field> Field. Expected/Actual Closure Date: Mask Value only (off). Info: Render Type (Single Select).\n- Dropdown field: gear → Enter Dropdown Options; Is Dependent Field? Yes/No; enter options one per line (top option is default) or import CSV; tick Allow Auto Update or Is Multi-Select Dropdown? if needed; Save or Close.\n\n### 10.8 Status Configuration\nSets which stages sit under each status. Open (9 stages), Won (1), Lost (2). Add adds a stage to the selected status. Enable comments on Status change (currently off). Default Status: Open; Default Stage: Lead Creation. Save or Cancel.\n\n### 10.9 Settings → Opportunities → Duplicate Detection\nEnabled for Opportunity (12000). Rule 1 (all must match): Phone contains data; the Contact has an Opportunity with Status \"Open\"; the Contact has an Opportunity whose Product matches the incoming Product. Pencil edits, bin deletes, + Next Rule adds a rule checked if the one above is not met. Save; changes take effect after 15 minutes. A new Opportunity is created only when no rule is met; otherwise a \"Duplicate Detected\" activity is added to the existing (oldest) Opportunity.\n\n### 10.10 Settings → Opportunities → Smart Views\nAdmins build the Smart Views Sales Users work from and assign them to teams. INCRED SMART VIEW (code 2): assigned to Mumbai Team and Delhi Team, 6 tabs. Also: Delhi Team (code 3, 3 tabs), Sample View (code 1, 1 tab).\nEdit Smart View: Name (required); Open Smart View in Full-Screen Mode by default (off); click a tab or its Details link to edit; each tab has filter icon, Search Opportunities, filters (Any Stage, Any Status, Any, Current User, Expected Closure…, All Time), Manage Filters, Actions, Configure; Save or Cancel.\nTabs in order: Leads, New Leads, Today Follow Up Leads, Drop Off Leads, Esign Leads, Application Submitted Leads.\nColumns: Leads — Phone, Name on Aadhaar, Status, Stage, Owner, Contact Name. New Leads — Name on Aadhaar, Mobile Number, Status, Stage, Owner, Contact Name. Today Follow Up Leads — Name on Aadhaar, Mobile Number, Call Disposition Details - Follow Up Date, Status, Stage, Owner, Contact Name. Drop Off Leads — Name on Aadhaar, Phone, Status, Stage, Owner, Contact Name. Application Submitted Leads — Name on Aadhaar, Mobile Number, Trading Experience, Segment Selection, Brokerage Plan, Status, Stage, Owner, Contact Name.\n\n### 10.11 Smart Views in an Administrator login\nContact-based. Tabs: My New Contacts, My Contacts with Pendi… (name cut off), My Engaged Contacts, My Customers, My Tasks; + adds a tab. Each tab: Search here, + Filter, Last Activity dropdown, refresh indicator.\n\n### 10.12 Automations\nAn automation runs steps when its trigger happens. Published = live. Reports and Live Edit at top right.\n\n#### Automation 1: Opp create (Published)\nFlow: New Opportunity → Distribute Opportunity → Update Contact.\n- Trigger: On Opportunity Added (type Opportunity); also runs on import.\n- Distribute Opportunity: default user set by the Admin; Get Latest Data true; user level quota disabled; Rule 1 (Opportunity Type is Opportunity) assigns to the set default user; no user availability check.\n- Update Contact: First Name ← opportunity's Name on Aadhaar; Owner ← opportunity's Owner.\n\n#### Automation 2: Stage Flow - Clone2/9 (Published)\nTrigger Opportunity Update (\"When Opportunity changes\") → Multi If/Else (\"Evaluating on trigger data\") → branches If, several Else If, final Else. Each branch checks \"Opportunity Type of the Contact is Opportunity and Stage is …\". Which team each branch assigns to is set by the Admin in each Distribute step's user properties; the teams below are the current setup. Working hours check (Compare steps): current time after 09:00 and before 17:00. Outside hours, the flow waits until 10:00 AM (\"0 Day(s) till 10:00 AM on all days\") before distributing.\n\nBranch 1 — Lead Verified: Update Stage Timeline (Lead Verified Start Time, Lead Creation End Time = now) → Wait 2 minutes → is Stage KYC?\n- Yes (moved to KYC): in working hours → Working Hour lead Flag = Yes, Drop Off Lead Flag = \"Moved to Next Stage\" → Distribute → 30 Min Stage Change Flag = Yes → Nudge Users. Outside hours → Working Hour lead Flag = No, Drop Off Lead Flag = \"Moved to Next Stage\" → wait till 10:00 AM → Distribute → Nudge Users.\n- No (still Lead Verified): in working hours → Working Hour lead Flag = Yes, Drop Off Lead Flag = Lead Verified Drop Off → Distribute → Nudge Users. Outside hours → Update Opportunity (Additional Details) → wait till 10:00 AM → Distribute (with user availability check) → Nudge Users.\n- All Distribute steps here: default user System; assign to users where Team is Mumbai Team.\n\nBranch 2 — Application Submitted: Update (Initial Owner = current owner; App Submitted Start Time, e-Sign End Time = now) → working-hours check.\n- In hours: Working Hour lead Flag = Yes → Distribute (Team is Delhi Team) → Nudge Users.\n- Outside: Working Hour lead Flag = No → wait till 10:00 AM → Distribute (Delhi Team) → Opp Owner Employee Code = owner's employee code, Opp Moved to Aplication Submit = Yes → Nudge Users.\n- Nudge: in-app (Mobile and Web) to the Opportunity Owner, template \"New Lead\", tells them a new lead has been assigned; button New Opportunity.\n\nBranch 3 — KYC: Update (KYC Start Time, Lead Verified End Time = now) → Wait 2 minutes → is Stage Customer Demographic & FATCA?\n- Yes: Drop Off Lead Flag = \"Moved to Next Stage\"; ends, no nudge.\n- No: Drop Off Lead Flag = KYC Drop Off → Nudge Users: in-app (Mobile and Web) to the Opportunity Owner, template \"Drop Off Stage Notify\", says the lead dropped off at a stage of the KYC flow; button VIEW LEAD.\n\nBranch 4 — Customer Demographic & FATCA: Update (FATCA Start Time, KYC End Time = now) → Wait 2 minutes → is Stage Bank Details & Verification?\n- Yes: Drop Off Lead Flag = \"Moved to Next Stage\"; ends.\n- No: Drop Off Lead Flag = FATCA Drop Off → Nudge Users (Drop Off Stage Notify, same as Branch 3).\n\nBranch 5 — Bank Details & Verification: Update (Bank Details Start Time, FATCA End Time = now) → Wait 2 minutes → is Stage Trading Preference & Segment Selection?\n- Yes: Drop Off Lead Flag = \"Moved to Next Stage\"; ends.\n- No: Drop Off Lead Flag = Bank Details Drop Off → Nudge Users (Drop Off Stage Notify, same as Branch 3).\n\nBranch 6 — Trading Preference & Segment Selection: Update (Bank Details End Time, Trading Preference Start Time = now) → Wait 2 minutes → is Stage Account Preferences?\n- Yes: Drop Off Lead Flag = \"Moved to Next Stage\"; ends.\n- No: Drop Off Lead Flag = Trading Drop Off → Nudge Users (Drop Off Stage Notify, same as Branch 3).\n\nBranch 7 — Account Preferences: Update (Trading Preference End Time, Account Preferences Start Time = now) → Wait 2 minutes → is Stage e-Sign (Selfie, Sign, KRA, AOF)?\n- Yes: Drop Off Lead Flag = \"Moved to Next Stage\"; ends.\n- No: Drop Off Lead Flag = Account Drop Off → Nudge Users (Drop Off Stage Notify, same as Branch 3).\n\nBranch 8 — e-Sign (Selfie, Sign, KRA, AOF): Update (e-Sign Start Time, Account Preferences End Time = now) → Wait 2 minutes → is Stage Application Submitted?\n- Yes: Drop Off Lead Flag = \"Moved to Next Stage\"; ends.\n- No: Drop Off Lead Flag = eSign Drop Off → Nudge Users (Drop Off Stage Notify, same as Branch 3).\n\nBranch 9 — Account Opened / First Trade: Update (Account Opened Start Time = now). Ends; no wait, flag, distribute or nudge.\nBranch 10 — Closed - Lost or Decided not to buy: Update (Decided Not to Buy Start Time and Closed - Lost Start Time = now, both set). Ends.\nFinal Else: runs when no condition is met (e.g. Lead Creation stage). No steps.\n\nStage Flow summary — stage checked → next stage expected after 2 minutes → drop-off flag if not reached:\nLead Verified → KYC → Lead Verified Drop Off; KYC → Customer Demographic & FATCA → KYC Drop Off; Customer Demographic & FATCA → Bank Details & Verification → FATCA Drop Off; Bank Details & Verification → Trading Preference & Segment Selection → Bank Details Drop Off; Trading Preference & Segment Selection → Account Preferences → Trading Drop Off; Account Preferences → e-Sign → Account Drop Off; e-Sign → Application Submitted → eSign Drop Off. Only Branches 1 (Lead Verified) and 2 (Application Submitted) assign the lead to a team (Mumbai and Delhi respectively, as currently set up).\n\n#### Automation 3: Task Created Nudge (Published)\nFlow: Task Created on Opportunity → Nudge Users.\n- Trigger: Task Created on Opportunity; Opportunity Type = Opportunity; Task Type = Meeting; Run once per opportunity = No (runs for every Meeting task).\n- Nudge Users: in-app on Mobile and Web to the Opportunity Owner, template \"New Task\". Tells the owner a new task has been assigned for the lead (Name on Aadhaar), asks them to complete it on time, and shows the Due Date (Call Disposition Details - Follow Up Date). Button VIEW LEAD opens the opportunity.\nThis is the alert an RM gets when a follow-up (Meeting) task is created.\n\n#### Automation 4: Follow Up Task Nudge (Published)\nFlow: Task Reminder for Opportunity → Nudge Users.\n- Trigger: Task Reminder for Opportunity; Opportunity Type = Opportunity; Task Type = Meeting; Run once per opportunity = No (runs for every Meeting task reminder).\n- Nudge Users: in-app on Mobile and Web to the Opportunity Owner, template \"New Lead\" (title \"Hello\"): a reminder that the lead (Name on Aadhaar) has been assigned, asking the owner to review it. Button New Opportunity.\nThis is the reminder an RM gets when a follow-up (Meeting) task is due.\n\n##
