## Automation 5: Call Disposition Flow (Published)\nRuns every time a Call Disposition is saved (trigger: On Opportunity Activity Added, activity Call Disposition, runs every time). This is the automation that creates follow-up tasks.\n- Update Opportunity: Call Disposition Details get Sub Disposition Status (from the form), Disposition Count (+1), Follow Up Date (from Follow-up Date & Time), Call Status (from the form).\n- If Disposition Count is 1 (first call): First Disposition Activity Dte and Last Disposition Activity Date = the call's time; Owner Last Disposition By = who logged it. Otherwise: Last Disposition Activity Date and Owner Last Disposition By only.\n- If a Follow-up Date & Time was entered: Create Task — Task Type Meeting on the Opportunity; owner and organizer = Opportunity Owner; subject \"Follow Up Meeting: <lead first name> <last name>\"; scheduled 1 minute after the Follow-up Date & Time. If no follow-up date, nothing else happens.\n- That Meeting task triggers Automation 3 (New Task alert when created) and Automation 4 (reminder alert when its reminder fires).\n\n#### Automation 6: Outbound Activity Flow (Published)\nRuns every time an outbound call is logged (trigger: On Opportunity Activity Added, activity Outbound Phone Call Activity, runs every time).\n- Update Opportunity: Call Status = the call's status; No of Call Attempts +1.\n- First call attempt (No of Call Attempts is 1): if Answered → First Connected Call Date, First Outbound Call Date, Last Outbound Call Date = call date, Last Called By = caller. If not answered → First and Last Outbound Call Date = call date, Last Called By = caller.\n- Later attempts: Last Outbound Call Date = call date, Last Called By = caller. Then if Answered and First Connected Call Date is empty → First and Last Connected Call Date = call date, Connected Call Counter +1. Otherwise if Answered → Last Connected Call Date = call date, Connected Call Counter +1. Unanswered calls stop there.\n- These fields are in the Phone Call Details field set.\n\n### 10.13 Forms (Workflow → Manage Forms)\nForms are the windows staff fill in, such as the Call Disposition Form that opens from Mark as Complete. Changes take effect after 5 minutes. Create Form adds one; the gear under Actions holds each form's options.\nCurrent forms: F5 Call Disposition Mumbai Form, F1 Call Disposition, F4 Lead Overview, F2 Edit Call Disposition Form (all Published), F3 Form 1 (Draft).\n\n#### Call Disposition Mumbai Form (F5)\nLayout:\n- Lead Details: Opportunity Name, Phone Number.\n- Call Details: Cal Status, Disposition, Sub Disposition, Follow-up Date & Time, Remarks.\n- Hidden (filled automatically, never shown): Call Session ID, Disposition Short Code, Agent ID, Status, Stage, Lead Phone Number, Lead Full Name, Lead Agent Name.\nRules (Configure Rules):\n- Form On Load: Cal Status mandatory; Opportunity Name read-only; Hidden section, Follow-up Date & Time and Remarks hidden; Agent ID = user's email, Lead Phone Number = lead's phone, Lead Full Name = opportunity name field, Lead Agent Name = user's first name, Call Session ID = dialler call session.\n- Mandatory- Dis: once Cal Status is picked, Disposition is mandatory.\n- Mandatory- Sub Dis: once Disposition is picked, Sub Disposition is mandatory.\n- Show Remark: once Sub Disposition is picked, Remarks appears.\n- Follow Up Field: Follow-up Date & Time appears only for 9 selected Sub Dispositions.\n- Disposition short codes (hidden Disposition Short Code field): Interested = CS_FLP; Poor Network = PNET; Not Interested = NI; Language Barrier = LB; Document Issue = DI; No Contact = NC and NCC (two rules with the same condition, so only one value is saved).\n\n#### Call Disposition (F1)\nSame three sections as F5. Lead Details: Opportunity Name, Phone Number. Call Details: Cal Status, Disposition, Sub Disposition, Follow-up Date & Time, Remarks. Hidden (fields in view): Disposition Short Code, Agent ID, Status, Stage, Lead Phone Number, Lead Agent Name, Lead Full Name, two Owner fields.\nDifferences from F5: Hidden has no Call Session ID and adds Owner fields.\nRules: same as F5, except Form On Load does not set Call Session ID. No Contact also has two rules (NC and NCC), so only one value is saved.\n\n#### Lead Overview (F4)\nA view-only form showing a lead's call history; it cannot be submitted. Same name as the Lead Overview shortcut on the Lead Detail page.\n- Lead Details: Opportunity Name, Phone Number.\n- Call Details: Call Disposition Details (Call Status, Call Disposition, Sub Disposition Status, First Disposition Activity Dte, Last Disposition Activity Date, Follow Up Date); Phone Call Details (No of Call Attempts, First and Last Outbound Call Date, First and Last Connected Call Date); Status.\n- Note: \"This form is for viewing purposes only and cannot be submitted.\" Hidden: Status, Stage, Owner.\n- Rules: Form On Load makes every field read-only and hides the Hidden section. Show Error: on submit (new UI, Marvin) if Status is defined, Disable Submission & Show Error on the Note field.\n\n#### Edit Call Disposition Form (F2)\nSame fields as the Call Disposition forms. Lead Details: Opportunity Name, Phone Number. Call Details: Cal Status, Disposition, Sub Disposition, Follow-up Date & Time, Remarks. Hidden: Status, Stage, two Owner fields.\nField properties (click a field): Schema Name, Data Type, Help Text, Display Name, Place Holder, Read Only (on for Phone Number), Hide by default, Validation Properties.\nForm On Load rule: Cal Status mandatory; Opportunity Name read-only; Hidden section hidden; Cal Status, Disposition, Sub Disposition, Follow-up Date & Time and Remarks all read-only — so the call details can be seen but not changed.\n";

const stem = w => w.length > 4 ? w.replace(/(ings|ing|ies|ied|ed|es|s)$/, '') : w;
function norm(t) {
  let s = ' ' + t.toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9&\-/ ]+/g, ' ') + ' ';
  for (const [k, v] of Object.entries(SYN)) s = s.replace(new RegExp(' ' + k.replace(/[-/]/g, '\\$&') + ' ', 'g'), ' ' + v + ' ');
  return s.split(/[\s/]+/).filter(Boolean).map(w => w.replace(/^-|-$/g, ''));
}
const terms = t => [...new Set(norm(t).filter(w => w.length > 1 && !STOP.has(w)).map(stem))];

  body: new Set(terms(plain(f.a))),

}));
function rankFaq(text, opts = {}) {
  const ts = terms(text); if (!ts.length) return [];
  const qn = ' ' + norm(text).join(' ') + ' ';
  return INDEX.map(x => {
    let s = 0, hit = 0;
    for (const t of ts) { if (x.head.has(t)) { s += 3; hit++; } else if (x.body.has(t)) { s += 1; hit += .5; } }
    for (const p of x.phrases) if (p.split(' ').length > 1 && qn.includes(' ' + p + ' ')) s += 4;
    const tn = norm(x.f.title).join(' '), qq = norm(text).join(' ');
    if (qq === tn) s += 8; else if (tn.startsWith(qq + ' ') || tn.startsWith(qq)) s += 3;
    const cov = hit / ts.length;
    const mult = x.f.role === role ? 1 : (opts.strictRole ? 0 : .7);
    return { f: x.f, s: s * cov * mult, cov };
  }).filter(r => r.s > 0).sort((a, b) => b.s - a.s);
}
function rankSections(text) {
  const ts = terms(text); if (!ts.length) return [];
  return SECTIONS.map(sec => {
    const title = sec.title.toLowerCase(), body = sec.body.toLowerCase(); let s = 0, hit = 0;
    for (const t of ts) { let h = false; if (title.includes(t)) { s += 6; h = true; } const n = body.split(t).length - 1; if (n) { s += Math.min(n, 5); h = true; } if (h) hit++; }
    s *= hit / ts.length; s *= role === 'admin' ? (sec.admin ? 1.3 : 1) : (sec.admin ? .5 : 1);
    return { sec, s };
  }).filter(r => r.s > 0).sort((a, b) => b.s - a.s);
}
function snippet(sec, ts) {
  const lines = plain(sec.body).split('\n').map(l => l.replace(/^[-\d.)\s]+/, '').trim()).filter(Boolean);
  const hit = lines.find(l => ts.some(t => l.toLowerCase().includes(t))) || lines[0] || '';
  return hit.length > 160 ? hit.slice(0, 157) + '…' : hit;
}

}
function addMsg(who, html) {
  const d = document.createElement('div'); d.className = 'msg ' + who;
  d.innerHTML = (who === 'bot' ? '<span class="avatar" aria-hidden="true">IC</span>' : '') + `<div class="bubble">${html}</div>`;
  log.appendChild(d); return d;
}
function scrollToMsg(el) { requestAnimationFrame(() => { const top = el.offsetTop - 12; chat.scrollTo({ top, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }); }
function chipsHtml(items, label) { return `<div class="chips">${label ? `<div class="chips-label">${esc(label)}</div>` : ''}${items.map(f => `<button class="chip" data-faq="${f.id}">${esc(f.title)}</button>`).join('')}</div>`; }

function answer(f, userText) {
  const { html, ref } = renderAnswer(f.a); const sec = sectionFor(ref);
  const related = (userText ? rankFaq(userText).map(r => r.f) : []).concat(FAQ.filter(x => x.group === f.group && x.role === f.role))
    .filter((x, i, arr) => x.id !== f.id && arr.findIndex(y => y.id === x.id) === i && (x.role === role || !userText)).slice(0, 3);
  const el = addMsg('bot', `<h3>${esc(f.title)}</h3>${html}
    <div class="actions">${sec ? `<button class="link-btn" data-sec="${sec.i}">Open ${esc(ref)} in the manual</button>` : ''}
      <span class="fb">Helpful?<button data-fb="yes">Yes</button><button data-fb="no" data-q="${esc(userText || f.title)}" data-id="${f.id}">No</button></span></div>
    ${related.length ? chipsHtml(related, 'Related') : ''}`);
  return el;
}
function notSure(text) {
  const faqs = rankFaq(text).slice(0, 3).map(r => r.f);
  const ts = terms(text); const secs = rankSections(text).slice(0, 3).map(r => r.sec);
  if (!faqs.length && !secs.length) {
    return addMsg('bot', `<p class="lead">I couldn’t find that in the manual.</p><p>Try asking with different words, pick a topic below, or browse the manual. If it still isn’t covered, ask your Team Lead or Admin.</p>${chipsHtml(FAQ.filter(f => f.role === role).slice(0, 6), 'Popular questions')}`);
  }
  let h = '<p class="lead">I’m not sure which of these you mean:</p>';
  if (faqs.length) h += chipsHtml(faqs, 'Quick answers');
  if (secs.length) h += `<div class="chips-label" style="margin-top:12px">In the manual</div><ul class="hits">${secs.map(s => `<li><b>${esc(s.title)}</b><span>${esc(snippet(s, ts))}</span><button class="link-btn" data-sec="${s.i}">Read this section</button></li>`).join('')}</ul>`;
  return addMsg('bot', h);
}
function respond(text) {
  const ranked = rankFaq(text); const best = ranked[0];
  const typing = addMsg('bot', '<span class="typing" aria-label="Typing"><i></i><i></i><i></i></span>');
  scrollToMsg(typing);
  setTimeout(() => {
    typing.remove();
    const second = ranked[1];
    const confident = best && best.cov >= .5 && (best.s >= 6 || (best.s >= 3 && (!second || best.s >= second.s * 1.25)));
    const el = confident ? answer(best.f, text) : notSure(text);
    scrollToMsg(el);
  }, 380);
}
function ask(text, viaFaq) {
  text = (text || '').trim(); if (!text) return;
  const u = addMsg('you', esc(text)); scrollToMsg(u);
  q.value = ''; autosize(); hideSuggest(); sendBtn.disabled = true;
  if (viaFaq) {
    const typing = addMsg('bot', '<span class="typing" aria-label="Typing"><i></i><i></i><i></i></span>');
    setTimeout(() => { typing.remove(); scrollToMsg(answer(viaFaq, null)); }, 300);
  } else respond(text);
}

function welcome() {
  log.innerHTML = '';
  const groups = [...new Set(FAQ.filter(f => f.role === role).map(f => f.group))];
  const intro = role === 'rm'
    ? '<p class="lead">Hi! I’m the InCred LeadSquared help assistant.</p><p>Ask me anything about your daily work: logging calls, follow-ups, which leads to work, alerts or your dashboard. Or tap a question below.</p>'
    : '<p class="lead">Hi! You’re in Admin help.</p><p>Ask about users and permissions, fields and dropdowns, Smart Views, forms or automations. Or tap a question below.</p>';
  let chips = '';
  for (const g of groups) chips += chipsHtml(FAQ.filter(f => f.role === role && f.group === g).slice(0, 5), g);
  addMsg('bot', intro + chips);
  chat.scrollTop = 0;
}

// ---------- suggestions while typing ----------
let selIdx = -1, sugItems = [];
function showSuggest() {
  const v = q.value.trim(); if (v.length < 2) return hideSuggest();
  sugItems = rankFaq(v, { strictRole: false }).filter(r => r.f.role === role).slice(0, 4).map(r => r.f);
  if (!sugItems.length) return hideSuggest();
  selIdx = -1;
  sug.innerHTML = sugItems.map((f, i) => `<button role="option" data-sug="${i}" aria-selected="false">${esc(f.title)}<small>${esc(f.qs[0])}</small></button>`).join('');
  sug.classList.add('on');
}
function hideSuggest() { sug.classList.remove('on'); sugItems = []; selIdx = -1; }
function moveSel(d) {
  if (!sugItems.length) return; selIdx = (selIdx + d + sugItems.length + 1) % (sugItems.length + 1) - 1;
  sug.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-selected', i === selIdx));
}
function autosize() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 140) + 'px'; }
let sugTimer;
q.addEventListener('input', () => { autosize(); sendBtn.disabled = !q.value.trim(); clearTimeout(sugTimer); sugTimer = setTimeout(showSuggest, 120); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && sugItems.length) { e.preventDefault(); moveSel(1); }
  else if (e.key === 'ArrowUp' && sugItems.length) { e.preventDefault(); moveSel(-1); }
  else if (e.key === 'Escape') hideSuggest();
  else if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (selIdx >= 0 && sugItems[selIdx]) { const f = sugItems[selIdx]; ask(f.title, f); } else ask(q.value);
  }
});
q.addEventListener('blur', () => setTimeout(hideSuggest, 150));
sendBtn.onclick = () => ask(q.value);
sug.addEventListener('mousedown', e => { const b = e.target.closest('[data-sug]'); if (b) { e.preventDefault(); const f = sugItems[+b.dataset.sug]; ask(f.title, f); } });

// ---------- clicks inside the chat ----------
log.addEventListener('click', e => {
  const c = e.target.closest('[data-faq]'); if (c) { const f = FAQ.find(x => x.id === c.dataset.faq); if (f) ask(f.title, f); return; }
  const s = e.target.closest('[data-sec]'); if (s) { openManual(+s.dataset.sec); return; }
  const fb = e.target.closest('[data-fb]');
  if (fb) {
    const wrap = fb.parentElement; wrap.querySelectorAll('button').forEach(b => b.disabled = true);
    if (fb.dataset.fb === 'yes') { wrap.innerHTML = 'Thanks!'; return; }
    wrap.innerHTML = 'Thanks for telling me.';
    const others = rankFaq(fb.dataset.q).map(r => r.f).filter(f => f.id !== fb.dataset.id).slice(0, 3);
    const secs = rankSections(fb.dataset.q).slice(0, 2).map(r => r.sec);
    const el = addMsg('bot', `<p class="lead">Let’s try another way.</p>${others.length ? chipsHtml(others, 'Did you mean') : ''}${secs.length ? `<div class="chips">${secs.map(s => `<button class="link-btn" data-sec="${s.i}">Manual: ${esc(s.title.slice(0, 60))}</button>`).join('')}</div>` : ''}<p style="margin-top:10px">Or ask your question with different words.</p>`);
    scrollToMsg(el); return;
  }
  const img = e.target.closest('figure img'); if (img) openZoom(img);
});

// ---------- manual ----------
function renderSectionBody(body) {
  let html = '', stack = [];
  const closeTo = d => { while (stack.length > d) html += stack.pop() === 'ol' ? '</ol>' : '</ul>'; };
  for (const raw of body.split('\n')) {
    if (!raw.trim()) { closeTo(0); continue; }
    const indent = raw.match(/^\s*/)[0].length; const l = raw.trim(); let m;
    if ((m = l.match(/^(\d+)[.)]\s+(.*)/)) || (m = l.match(/^[-•]\s+(.*)/))) {
      const type = /^\d/.test(l) ? 'ol' : 'ul'; const depth = indent >= 2 ? 2 : 1; const text = m[m.length - 1];
      closeTo(depth);
      if (stack.length === depth && stack[depth - 1] !== type) closeTo(depth - 1);
      if (stack.length < depth) { html += type === 'ol' ? `<ol start="${m[1]}">` : '<ul>'; stack.push(type); }
      html += `<li>${inline(text)}</li>`; continue;
    }
    closeTo(0);
    html += /:$/.test(l) && l.length < 70 ? `<h4>${inline(l.replace(/:$/, ''))}</h4>` : `<p>${inline(l)}</p>`;
  }
  closeTo(0); return html;
}
function shotsFor(sec) {
  if (!sec.num) return [];
  return Object.entries(IMGS).filter(([k, v]) => v.sec === sec.num).map(([k]) => k);
}
function manualHome(filter = '') {
  const box = $('#manual'); const f = filter.trim().toLowerCase();
  const match = s => !f || s.title.toLowerCase().includes(f) || s.body.toLowerCase().includes(f);
  const rowsFor = arr => arr.filter(match).map(s => `<button class="row${s.num || s.level <= 2 ? '' : ' sub'}" data-open="${s.i}"><span>${f ? highlight(s.title, f) : esc(s.title)}</span>${CHEV}</button>`).join('');
  const user = SECTIONS.filter(s => s.level >= 2 && !s.admin), adm = SECTIONS.filter(s => s.admin);
  const u = rowsFor(user), a = rowsFor(adm);
  box.innerHTML = `<input class="msearch" id="msearch" type="search" placeholder="Search the manual" value="${esc(filter)}" aria-label="Search the manual">
    ${u ? `<div class="toc-h">Sales User guide</div><div class="list">${u}</div>` : ''}
    ${a ? `<div class="toc-h">Admin guide</div><div class="list">${a}</div>` : ''}
    ${!u && !a ? `<p>No sections match “${esc(filter)}”.</p>` : ''}`;
  const ms = $('#msearch'); ms.addEventListener('input', () => { const pos = ms.selectionStart; manualHome(ms.value); const n = $('#msearch'); n.focus(); n.setSelectionRange(pos, pos); });
  box.scrollTop = 0;
}
function highlight(t, f) { const i = t.toLowerCase().indexOf(f); return i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + f.length)) + '</mark>' + esc(t.slice(i + f.length)); }
function manualSection(i) {
  const s = SECTIONS[i]; if (!s) return manualHome();
  const prev = SECTIONS[i - 1], next = SECTIONS[i + 1]; const shots = shotsFor(s);
  $('#manual').innerHTML = `<div class="sec">
    <button class="back" data-home>← All sections</button>
    ${s.parent ? `<div style="color:var(--muted);font-size:.9rem">Part of ${esc(s.parent.title)}</div>` : ''}
    <h1>${esc(s.title)}</h1>
    <div class="sec-body">${renderSectionBody(s.body) || '<p>This heading groups the sections that follow.</p>'}</div>
    ${shots.length ? `<div class="shots-h">Screenshots</div>${shots.map(fig).join('')}` : ''}
    <div class="pager">${prev ? `<button class="link-btn" data-open="${prev.i}">← ${esc(prev.title.slice(0, 38))}</button>` : '<span></span>'}${next ? `<button class="link-btn" data-open="${next.i}">${esc(next.title.slice(0, 38))} →</button>` : ''}</div>
  </div>`;
  $('#manual').scrollTop = 0;
}
function openManual(i) { $('#sheet').classList.add('on'); if (typeof i === 'number') manualSection(i); else manualHome(); }
function closeManual() { $('#sheet').classList.remove('on'); q.focus(); }
$('#openManual').onclick = () => openManual();
$('#closeManual').onclick = closeManual;
$('#sheet').addEventListener('click', e => {
  if (e.target.id === 'sheet') return closeManual();
  const o = e.target.closest('[data-open]'); if (o) return manualSection(+o.dataset.open);
  if (e.target.closest('[data-home]')) return manualHome();
  const img = e.target.closest('figure img'); if (img) openZoom(img);
});

// ---------- misc ----------
function openZoom(img) { $('#zoom img').src = img.src; $('#zoom img').alt = img.alt; $('#zoom').classList.add('on'); }
$('#zoom').onclick = () => $('#zoom').classList.remove('on');
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#zoom').classList.contains('on')) $('#zoom').classList.remove('on'); else if ($('#sheet').classList.contains('on')) closeManual(); } });
function setRole(r, announce) {
  role = r; try { localStorage.setItem('lsqRole', r); } catch (e) {}
  document.querySelectorAll('.role button').forEach(b => b.setAttribute('aria-pressed', b.dataset.role === r));
  const small = matchMedia('(max-width: 600px)').matches;
  q.placeholder = small ? 'Ask a question…' : (r === 'rm' ? 'Ask a question, e.g. how do I set a follow-up?' : 'Ask a question, e.g. how do I add a new user?');
  if (announce) { const groups = [...new Set(FAQ.filter(f => f.role === role).map(f => f.group))];
    const el = addMsg('bot', `<p class="lead">Switched to ${r === 'rm' ? 'Sales User' : 'Admin'} help.</p>${groups.map(g => chipsHtml(FAQ.filter(f => f.role === role && f.group === g).slice(0, 4), g)).join('')}`); scrollToMsg(el); }
}
document.querySelectorAll('.role button').forEach(b => b.onclick = () => { if (b.dataset.role !== role) setRole(b.dataset.role, log.children.length > 1); if (log.children.length <= 1) welcome(); });
$('#newChat').onclick = () => { welcome(); q.focus(); };
setRole(role, false); welcome();
if (matchMedia('(min-width: 700px)').matches) q.focus();
</script>
